name: FoodSafe AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend CI & Database Regression
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: smart_food_safety
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password smart_food_safety < frontend/database.sql

      - name: Configure Test Environment
        run: |
          cat << 'EOF' > backend/.env
          NODE_ENV=test
          PORT=5000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=test_root_password
          DB_NAME=smart_food_safety
          JWT_SECRET=ci_secure_test_jwt_key_that_is_at_least_32_characters_long
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Run Backend Regression Test Suite
        run: |
          cd backend
          npm test

      - name: Run Supply Chain Security Audit
        run: |
          cd backend
          npm audit --audit-level=high

  frontend-build:
    name: Frontend CI & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Code Style & Linting
        run: |
          cd frontend
          npm run lint

      - name: Compile Production Bundle
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api.foodsafe.example.com/api

      - name: Run Frontend Security Audit
        run: |
          cd frontend
          npm audit --audit-level=high
